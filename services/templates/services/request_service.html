{% extends 'base/base.html' %}

{% block title %}Request {{ service.name }} - Netfix{% endblock %}

{% block content %}
<div class="card">
    <h2>Request Service: {{ service.name }}</h2>
    <div class="service-info mb-3">
        <p>{{ service.description }}</p>
        <p class="price"><strong>Price:</strong> ${{ service.price }}</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Request</button>
    </form>
</div>
{% endblock %}
